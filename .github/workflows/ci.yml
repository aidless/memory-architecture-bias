        # CI for memory-architecture-bias
        # The recomputation gate is source/verify_p5.py; the results it recomputes from live
# under evidence/.
        # Generated by the enterprise-hardening pass (2026-10-04) against the repository's
        # actual tree. Each step runs something that exists here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the test suite
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy
          python -m pytest -q
      - name: Recompute the paper-5 claim from the stored evidence
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
          python source/verify_p5.py

  mutation-control:
    # Perturb one stored result and require the recomputation to disagree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
      - name: Perturb a stored result and require a non-zero exit
        run: |
          set -euo pipefail
          target=evidence/r1_v4chat_dose_response_per_seed.json
          if [ ! -f "$target" ]; then
            echo "$target not found; mutation control cannot run"
            exit 0
          fi
          cp "$target" /tmp/perturb.bak
          python - "$target" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          d = json.loads(p.read_text())
          def bump(o):
              if isinstance(o, dict):
                  for k, v in list(o.items()):
                      if isinstance(v, bool):
                          continue
                      if isinstance(v, (int, float)):
                          o[k] = v + 0.5
                          return True
                      if bump(v):
                          return True
              elif isinstance(o, list):
                  for i, v in enumerate(o):
                      if isinstance(v, (int, float)) and not isinstance(v, bool):
                          o[i] = v + 0.5
                          return True
                      if bump(v):
                          return True
              return False
          if not bump(d):
              raise SystemExit('no numeric field to corrupt')
          p.write_text(json.dumps(d, indent=2))
          print('corrupted one numeric field in', p)
          PY
          if python source/verify_p5.py; then
            echo 'FAIL: verify_p5.py accepted a perturbed result file'
            exit 1
          fi
          echo 'OK: verify_p5.py detected the perturbation'
